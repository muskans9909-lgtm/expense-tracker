<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Personal Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main class="app-container">
    <header class="app-header">
      <h1>Expense Tracker</h1>
      <p>Manage your daily income and expenses</p>
    </header>

    <!-- 1. Summary Cards -->
    <section class="summary-section">
      <div class="summary-card balance">
        <h3>Total Balance</h3>
        <p id="total-balance">₹0.00</p>
      </div>
      <div class="summary-card income">
        <h3>Total Income</h3>
        <p id="total-income">₹0.00</p>
      </div>
      <div class="summary-card expense">
        <h3>Total Expenses</h3>
        <p id="total-expense">₹0.00</p>
      </div>
    </section>

    <!-- 2. Form Section -->
    <section class="form-section">
      <h2 id="form-heading">Add New Transaction</h2>
      <form id="transaction-form">
        <input type="hidden" id="edit-id" value="">

        <div class="form-group">
          <label for="desc">Description</label>
          <input type="text" id="desc" placeholder="e.g., Salary, Coffee" required>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="amount">Amount (₹)</label>
            <input type="number" id="amount" placeholder="e.g., 500" min="1" step="any" required>
          </div>

          <div class="form-group">
            <label for="type">Type</label>
            <select id="type" required>
              <option value="expense">Expense</option>
              <option value="income">Income</option>
            </select>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="category">Category</label>
            <select id="category" required>
              <option value="Salary">Salary</option>
              <option value="Food & Dining">Food & Dining</option>
              <option value="Transportation">Transportation</option>
              <option value="Shopping">Shopping</option>
              <option value="Bills & Utilities">Bills & Utilities</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="form-group">
            <label for="date">Date</label>
            <input type="date" id="date" required>
          </div>
        </div>

        <button type="submit" id="submit-btn" class="btn primary-btn">Add Transaction</button>
      </form>
    </section>

    <!-- 3. Transaction History Section -->
    <section class="history-section">
      <div class="history-header">
        <h2>Transaction History</h2>
        
        <div class="filter-controls">
          <div class="filter-group">
            <label for="filter-category">Filter:</label>
            <select id="filter-category">
              <option value="all">All Categories</option>
              <option value="Salary">Salary</option>
              <option value="Food & Dining">Food & Dining</option>
              <option value="Transportation">Transportation</option>
              <option value="Shopping">Shopping</option>
              <option value="Bills & Utilities">Bills & Utilities</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <button id="clear-all-btn" class="clear-btn" type="button">Clear All</button>
        </div>
      </div>

      <ul id="transaction-list" class="transaction-list">
        <li class="empty-state">No transactions added yet.</li>
      </ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
